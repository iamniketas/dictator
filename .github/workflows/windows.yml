name: Windows CI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/windows/**'
      - 'shared/**'
  pull_request:
    paths:
      - 'apps/windows/**'
      - 'shared/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows

      # whisper-rs-sys uses bindgen which requires libclang
      - name: Install LLVM
        run: choco install llvm --no-progress -y

      - name: Cargo check
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: cargo check --all-targets

      - name: Cargo test
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: cargo test --all-targets
