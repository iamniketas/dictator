name: Release (Windows + macOS)

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: ver
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows

      - name: Install LLVM
        run: choco install llvm --no-progress -y

      - name: Build release binary
        working-directory: apps/windows
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: cargo build --release

      - name: Stage app for packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path apps/windows/dist -Force
          Copy-Item apps/windows/target/release/dictator.exe apps/windows/dist/

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install vpk CLI
        run: dotnet tool install --global vpk

      - name: Package with Velopack
        working-directory: apps/windows
        shell: pwsh
        run: |
          vpk pack `
            --packId dictator `
            --packVersion ${{ steps.ver.outputs.VERSION }} `
            --packDir dist `
            --mainExe dictator.exe `
            --outputDir Releases `
            --packTitle "Dictator" `
            --icon assets/dictator.ico

      - name: Publish GitHub Release assets (Windows)
        uses: softprops/action-gh-release@v2
        with:
          name: "Dictator v${{ steps.ver.outputs.VERSION }}"
          generate_release_notes: true
          files: apps/windows/Releases/*

  release-macos:
    runs-on: macos-14
    permissions:
      contents: write
    outputs:
      appcast_feed_url: ${{ steps.feed.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcode-select -p
          xcodebuild -version

      - name: Extract version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate Sparkle secrets
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          MACOS_DEVELOPER_ID_APP_CERT_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APP_CERT_P12_BASE64 }}
          MACOS_DEVELOPER_ID_APP_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APP_CERT_PASSWORD }}
          MACOS_DEVELOPER_ID_APP_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APP_SIGNING_IDENTITY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_API_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || { echo "Missing secret: SPARKLE_PRIVATE_KEY"; exit 1; }
          [[ -n "$SPARKLE_PUBLIC_KEY" ]] || { echo "Missing secret: SPARKLE_PUBLIC_KEY"; exit 1; }

      - name: Detect signing/notarization mode
        id: signing
        env:
          MACOS_DEVELOPER_ID_APP_CERT_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APP_CERT_P12_BASE64 }}
          MACOS_DEVELOPER_ID_APP_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APP_CERT_PASSWORD }}
          MACOS_DEVELOPER_ID_APP_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APP_SIGNING_IDENTITY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_API_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          if [[ -n "$MACOS_DEVELOPER_ID_APP_CERT_P12_BASE64" && -n "$MACOS_DEVELOPER_ID_APP_CERT_PASSWORD" && -n "$MACOS_DEVELOPER_ID_APP_SIGNING_IDENTITY" && -n "$MACOS_NOTARY_KEY_ID" && -n "$MACOS_NOTARY_ISSUER_ID" && -n "$MACOS_NOTARY_API_KEY_P8_BASE64" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "identity=$MACOS_DEVELOPER_ID_APP_SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"
            echo "Using Developer ID signing + notarization."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "Developer ID/notarization secrets are not configured. Producing unsigned/notarized-skipped artifacts for internal testing."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_DEVELOPER_ID_APP_CERT_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APP_CERT_P12_BASE64 }}
          MACOS_DEVELOPER_ID_APP_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APP_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/dictator-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"

          CERT_P12="$RUNNER_TEMP/developer_id_application.p12"
          printf '%s' "$MACOS_DEVELOPER_ID_APP_CERT_P12_BASE64" | base64 --decode > "$CERT_P12"
          security import "$CERT_P12" -k "$KEYCHAIN_PATH" -P "$MACOS_DEVELOPER_ID_APP_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build macOS app bundle
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/sparkle/appcast.xml
        run: |
          cd apps/macos
          xcodebuild \
            -scheme DictatorMac \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath ../../build/macos-derived \
            build

      - name: Assemble .app bundle
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/sparkle/appcast.xml
          DICTATOR_BUNDLE_NAME: Dictator
          DICTATOR_ICON_SOURCE_PNG: apps/macos/Sources/DictatorMac/Resources/status-idle.png
          DICTATOR_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          BUILD_PRODUCTS_DIR="build/macos-derived/Build/Products/Release"
          ./scripts/macos/assemble_app_bundle.sh \
            "$BUILD_PRODUCTS_DIR" \
            "DictatorMac" \
            "$VERSION" \
            "$SPARKLE_PUBLIC_KEY" \
            "$FEED_URL" \
            "com.iamniketas.dictatormac"

      - name: Notarize and staple .app bundle
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_API_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          APP_PATH="build/macos-derived/Build/Products/Release/Dictator.app"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${MACOS_NOTARY_KEY_ID}.p8"
          printf '%s' "$MACOS_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"

          xcrun notarytool store-credentials "dictator-notary-profile" \
            --key "$KEY_PATH" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID"

          xcrun notarytool submit "$APP_PATH" --keychain-profile "dictator-notary-profile" --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Package release artifacts
        id: package
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
          DICTATOR_BUNDLE_NAME: Dictator
          DICTATOR_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          APP_PATH="build/macos-derived/Build/Products/Release/Dictator.app"
          OUT_DIR="build/macos-release"
          ./scripts/macos/package_release_artifacts.sh "$APP_PATH" "$VERSION" "$OUT_DIR"

          ZIP_PATH="$OUT_DIR/Dictator-${VERSION}-macOS.zip"
          DMG_PATH="$OUT_DIR/Dictator-${VERSION}-macOS.dmg"
          echo "zip=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple .dmg
        if: steps.signing.outputs.enabled == 'true'
        run: |
          xcrun notarytool submit "${{ steps.package.outputs.dmg }}" --keychain-profile "dictator-notary-profile" --wait
          xcrun stapler staple "${{ steps.package.outputs.dmg }}"
          xcrun stapler validate "${{ steps.package.outputs.dmg }}"

      - name: Warn when release is not notarized
        if: steps.signing.outputs.enabled != 'true'
        run: |
          echo "::warning::macOS release artifacts are unsigned/notarized for internal testing only. Configure Developer ID + notarization secrets to remove Gatekeeper warnings."

      - name: Generate Sparkle appcast
        id: appcast
        env:
          TAG: ${{ github.ref_name }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          OUT_DIR="build/macos-release"
          UPDATES_DIR="build/macos-updates"
          mkdir -p "$UPDATES_DIR"
          cp "${{ steps.package.outputs.zip }}" "$UPDATES_DIR/"

          KEY_FILE="build/sparkle_private_key.txt"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"

          SPARKLE_DIR="build/Sparkle"
          git clone --depth 1 --branch 2.9.0 https://github.com/sparkle-project/Sparkle.git "$SPARKLE_DIR"

          ./scripts/macos/generate_appcast.sh \
            "$SPARKLE_DIR" \
            "$UPDATES_DIR" \
            "$KEY_FILE" \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/"

          cp "$UPDATES_DIR/appcast.xml" "$OUT_DIR/appcast.xml"
          echo "path=$OUT_DIR/appcast.xml" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release assets (macOS)
        uses: softprops/action-gh-release@v2
        with:
          name: "Dictator v${{ steps.ver.outputs.VERSION }}"
          generate_release_notes: false
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.dmg }}
            ${{ steps.appcast.outputs.path }}

      - name: Upload appcast site artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparkle-appcast-site
          path: ${{ steps.appcast.outputs.path }}

      - name: Expose feed URL
        id: feed
        run: |
          echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/sparkle/appcast.xml" >> "$GITHUB_OUTPUT"

  publish-appcast:
    needs: release-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download appcast artifact
        uses: actions/download-artifact@v4
        with:
          name: sparkle-appcast-site
          path: site/sparkle

      - name: Deploy appcast to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          keep_files: true

  verify-release-macos-assets:
    needs: [release-macos, publish-appcast]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Verify release has Sparkle assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSETS_JSON="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets)"
          echo "$ASSETS_JSON" | jq -e '.assets[] | select(.name | test("^Dictator-.*-macOS\\.zip$"))' >/dev/null
          echo "$ASSETS_JSON" | jq -e '.assets[] | select(.name | test("^Dictator-.*-macOS\\.dmg$"))' >/dev/null
          echo "$ASSETS_JSON" | jq -e '.assets[] | select(.name == "appcast.xml")' >/dev/null

      - name: Print feed URL
        run: |
          echo "Sparkle feed URL: ${{ needs.release-macos.outputs.appcast_feed_url }}"
