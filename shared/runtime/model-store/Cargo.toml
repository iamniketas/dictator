[package]
name = "model-store"
version = "0.1.0"
edition = "2021"
description = "Shared model catalog and installed-state store for Dictator/Contora"
license = "MIT"

[lib]
name = "model_store"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hardware-profiler = { path = "../hardware-profiler" }
