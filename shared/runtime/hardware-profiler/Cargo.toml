[package]
name = "hardware-profiler"
version = "0.1.0"
edition = "2021"
description = "Cross-platform hardware profiling module for Dictator/Contora"
license = "MIT"

[lib]
name = "hardware_profiler"
path = "src/lib.rs"

[[bin]]
name = "hardware-profiler"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
