# Dictator Configuration
# This file is auto-created in %APPDATA%/dictator/config.toml on first run
# You can edit it manually or it will use defaults below

[hotkey]
modifiers = ["ctrl", "shift"]
key = "D"

[audio]
# device = "Microphone Name"  # Optional: specify device, or leave commented for default
sample_rate = 16000

[whisper]
model_path = "C:\\path\\to\\faster-whisper-large-v2"  # Change this to your model path
language = "ru"

[ollama]
url = "http://localhost:11434"
model = "glm-4.7-flash"  # Fast model for coding and text work
